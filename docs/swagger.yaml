paths:
  /admin/categories:
    get:
      description: get all category
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseCategories'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseCategories'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseCategories'
      summary: get all category
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: create category
      parameters:
      - description: create category
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
      summary: create category
      tags:
      - Categories
  /admin/categories/{id}:
    delete:
      consumes:
      - application/json
