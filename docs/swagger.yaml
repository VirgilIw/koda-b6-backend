basePath: /
definitions:
  dto.AuthLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.Category:
    properties:
      categories_name:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: integer
      updated_at:
        type: string
    type: object
  dto.CategoryRequest:
    properties:
      categories_name:
        type: string
    type: object
  dto.Coupon:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      image:
        type: string
      title:
        type: string
      value:
        type: string
    type: object
  dto.CouponRequest:
    properties:
      description:
        type: string
      id:
        type: integer
      image:
        type: string
      title:
        type: string
      value:
        type: string
    type: object
  dto.CreateProductRequest:
    properties:
      description:
        type: string
      id:
        type: integer
      is_birthday_package:
        type: boolean
      is_buyget1:
        type: boolean
      is_flash_sale:
        type: boolean
      name:
        type: string
      price:
        type: number
    type: object
  dto.CreateProductResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      is_birthday_package:
        type: boolean
      is_buyget1:
        type: boolean
      is_flash_sale:
        type: boolean
      name:
        type: string
      price:
        type: number
    type: object
  dto.Product:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      image_path:
        type: string
      is_birthday_package:
        type: boolean
      is_buy1get1:
        type: boolean
      is_flash_sale:
        type: boolean
      name:
        type: string
      price:
        type: number
      rating:
        type: number
    type: object
  dto.ProductDetail:
    properties:
      id:
        type: integer
      name:
        type: string
      price:
        type: integer
      size_prices:
        items:
          type: integer
        type: array
      sizes:
        items:
          type: string
        type: array
      total_testimonials:
        type: integer
      variant_prices:
        items:
          type: integer
        type: array
      variants:
        type: string
    type: object
  dto.ProductDetailResponse:
    properties:
      error:
        type: string
      message:
        type: string
      result:
        $ref: '#/definitions/dto.ProductDetail'
      success:
        type: boolean
    type: object
  dto.ProductsResponse:
    properties:
      error:
        type: string
      message:
        type: string
      result:
        items:
          $ref: '#/definitions/dto.Product'
        type: array
      success:
        type: boolean
    type: object
  dto.Response:
    properties:
      error:
        type: string
      message:
        type: string
      result:
        items:
          $ref: '#/definitions/dto.Users'
        type: array
      success:
        type: boolean
    type: object
  dto.ResponseCategories:
    properties:
      error:
        type: string
      message:
        type: string
      result:
        items:
          $ref: '#/definitions/dto.Category'
        type: array
      success:
        type: boolean
    type: object
  dto.ResponseCategory:
    properties:
      error:
        type: string
      message:
        type: string
      result:
        $ref: '#/definitions/dto.Category'
      success:
        type: boolean
    type: object
  dto.ResponseCoupon:
    properties:
      error:
        type: string
      message:
        type: string
      result:
        $ref: '#/definitions/dto.Coupon'
      success:
        type: boolean
    type: object
  dto.ResponseOneData:
    properties:
      message:
        type: string
      result:
        $ref: '#/definitions/dto.Users'
      success:
        type: boolean
    type: object
  dto.ResponseSize:
    properties:
      error:
        type: string
      message:
        type: string
      result:
        $ref: '#/definitions/dto.Size'
      success:
        type: boolean
    type: object
  dto.ResponseSizes:
    properties:
      error:
        type: string
      message:
        type: string
      result:
        items:
          $ref: '#/definitions/dto.Size'
        type: array
      success:
        type: boolean
    type: object
  dto.ResponseToken:
    properties:
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
      token:
        type: string
    type: object
  dto.SingleProductResponse:
    properties:
      error:
        type: string
      message:
        type: string
      result:
        $ref: '#/definitions/dto.CreateProductResponse'
      success:
        type: boolean
    type: object
  dto.Size:
    properties:
      additional_price:
        type: integer
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: integer
      size_name:
        type: string
      updated_at:
        type: string
    type: object
  dto.UpdateProductRequest:
    properties:
      description:
        type: string
      id:
        type: integer
      is_birthday_package:
        type: boolean
      is_buyget1:
        type: boolean
      is_flash_sale:
        type: boolean
      name:
        type: string
      price:
        type: number
    type: object
  dto.Users:
    properties:
      address:
        type: string
      email:
        type: string
      fullname:
        type: string
      id:
        type: integer
      password:
        type: string
      phone:
        type: string
      picture:
        type: string
      role:
        type: string
    type: object
host: localhost:8888
info:
  contact: {}
  description: Coffeshop BE documentation
  title: Coffeshop Backend
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseToken'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseToken'
      summary: Login
      tags:
      - Authentication
  /categories:
    get:
      description: get all category
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseCategories'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseCategories'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseCategories'
      summary: get all category
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: create category
      parameters:
      - description: create category
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
      summary: create category
      tags:
      - Categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: Delete category
      parameters:
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
      summary: Delete category
      tags:
      - Categories
    get:
      consumes:
      - application/json
      description: get category by id
      parameters:
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
      summary: get category by id
      tags:
      - Categories
    patch:
      consumes:
      - application/json
      description: update category
      parameters:
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      - description: update category
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
      summary: update category
      tags:
      - Categories
  /coupons:
    get:
      description: Get list of coupons
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
      summary: Get All Coupons
      tags:
      - Coupons
    post:
      consumes:
      - application/json
      description: Create a new coupon
      parameters:
      - description: Coupon request body
        in: body
        name: coupon
        required: true
        schema:
          $ref: '#/definitions/dto.CouponRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
      summary: Create Coupon
      tags:
      - Coupons
  /coupons/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a coupon
      parameters:
      - description: Coupon request id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
      summary: Delete Coupon
      tags:
      - Coupons
    get:
      consumes:
      - application/json
      description: Get Coupon By ID
      parameters:
      - description: Coupon ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
      summary: Get Coupon
      tags:
      - Coupons
    patch:
      consumes:
      - application/json
      description: Edit a coupon
      parameters:
      - description: Coupon request body
        in: body
        name: coupon
        required: true
        schema:
          $ref: '#/definitions/dto.CouponRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseCoupon'
      summary: Edit Coupon
      tags:
      - Coupons
  /products:
    delete:
      consumes:
      - application/json
      description: Delete product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
      security:
      - BearerAuth: []
      summary: Delete product
      tags:
      - Products
    get:
      description: Get products
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
      security:
      - BearerAuth: []
      summary: Get products
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Create new product
      parameters:
      - description: Create product request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.SingleProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.SingleProductResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.SingleProductResponse'
      security:
      - BearerAuth: []
      summary: Create product
      tags:
      - Products
  /products/{id}:
    get:
      description: Get a single product by ID and calculate price based on selected
        size and variant
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Size
        example: Regular/Medium/Large
        in: query
        name: size
        type: string
      - description: Variant
        example: Hot/Iced
        in: query
        name: variant
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProductDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
      security:
      - BearerAuth: []
      summary: Get product by ID size variant
      tags:
      - Products
    patch:
      consumes:
      - application/json
      description: Update existing product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update product request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ProductsResponse'
      security:
      - BearerAuth: []
      summary: Update product
      tags:
      - Products
  /sizes:
    get:
      consumes:
      - application/json
      description: Get all sizes
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSizes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseSizes'
      summary: get all sizes
      tags:
      - Sizes
  /sizes/{id}:
    get:
      consumes:
      - application/json
      description: retrieve size by id
      parameters:
      - description: size id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseSize'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseSize'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ResponseSize'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseSize'
      summary: get size by id
      tags:
      - Sizes
  /users:
    get:
      description: Get users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Get users
      tags:
      - Users
    patch:
      consumes:
      - multipart/form-data
      description: Update the logged-in user's profile, including optional picture
        upload
      parameters:
      - description: Full name
        in: formData
        name: fullname
        type: string
      - description: Email
        in: formData
        name: email
        type: string
      - description: Password
        in: formData
        name: password
        type: string
      - description: Phone number
        in: formData
        name: phone
        type: string
      - description: Address
        in: formData
        name: address
        type: string
      - description: Role
        in: formData
        name: role
        type: string
      - description: Profile picture
        in: formData
        name: picture
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseOneData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseOneData'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseOneData'
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - Users
    post:
      consumes:
      - multipart/form-data
      description: Create user with optional picture upload
      parameters:
      - description: Full Name
        in: formData
        name: full_name
        required: true
        type: string
      - description: Email
        in: formData
        name: email
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      - description: Phone Number
        in: formData
        name: phone
        type: string
      - description: Address
        in: formData
        name: address
        type: string
      - description: Role
        in: formData
        name: role
        type: string
      - description: Profile Picture
        in: formData
        name: picture
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Create a new user
      tags:
      - Users
  /users/{id}:
    delete:
      description: Delete users
      parameters:
      - description: User Id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Delete users
      tags:
      - Users
    get:
      description: Get users by id
      parameters:
      - description: users id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseOneData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Get users by id
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer" followed by a space and JWT token. Example: "Bearer
      eyJhbGciO..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
