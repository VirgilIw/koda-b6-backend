        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
      summary: update category
      tags:
