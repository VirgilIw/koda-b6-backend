      - Categories
    get:
      consumes:
      - application/json
      description: get category by id
      parameters:
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseCategory'
        "400":
          description: Bad Request
