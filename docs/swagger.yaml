basePath: /
definitions:
  dto.AuthLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.Response:
    properties:
      error:
        type: string
      message:
        type: string
      result:
        items:
          $ref: '#/definitions/dto.Users'
        type: array
      success:
        type: boolean
    type: object
  dto.ResponseOneData:
    properties:
      message:
        type: string
      result:
        $ref: '#/definitions/dto.Users'
      success:
        type: boolean
    type: object
  dto.ResponseToken:
    properties:
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
      token:
        type: string
    type: object
  dto.Users:
    properties:
      address:
        type: string
      email:
        type: string
      fullname:
        type: string
      id:
        type: integer
      password:
        type: string
      phone:
        type: string
      picture:
        type: string
      role:
        type: string
    type: object
host: localhost:8888
info:
  contact: {}
  description: Coffeshop BE documentation
  title: Coffeshop Backend
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseToken'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseToken'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ResponseToken'
      summary: Login
      tags:
      - Authentication
  /users:
    get:
      description: Get users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Get users
      tags:
      - Users
    patch:
      consumes:
      - multipart/form-data
      description: Update the logged-in user's profile, including optional picture
        upload
      parameters:
      - description: Full name
        in: formData
        name: fullname
        type: string
      - description: Email
        in: formData
        name: email
        type: string
      - description: Password
        in: formData
        name: password
        type: string
      - description: Phone number
        in: formData
        name: phone
        type: string
      - description: Address
        in: formData
        name: address
        type: string
      - description: Role
        in: formData
        name: role
        type: string
      - description: Profile picture
        in: formData
        name: picture
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseOneData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ResponseOneData'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ResponseOneData'
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer" followed by a space and JWT token. Example: "Bearer
      eyJhbGciO..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
